name: Test booking engine

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run assertion suite and jsdom smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tests/package.json

      - name: Install test dependencies
        working-directory: tests
        run: npm install

      - name: Run string assertion suite
        working-directory: tests
        run: node assert.js

      - name: Run jsdom render smoke test
        working-directory: tests
        run: node smoke.js
